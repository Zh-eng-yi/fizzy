[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fizzy"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "litellm>=1.40.0",         # unified LLM API (Anthropic, Gemini, OpenAI, ...)
    "rich>=13.7.0",
    "prompt_toolkit>=3.0.47",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
]

[project.scripts]
fizzy = "fizzy.main:app"
